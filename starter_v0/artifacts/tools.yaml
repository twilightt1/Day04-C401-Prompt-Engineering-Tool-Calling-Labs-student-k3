# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Hỏi lại người dùng khi thiếu thông tin bắt buộc, hoặc để xin xác nhận
      trước một hành động có tác dụng ra bên ngoài (gửi, đăng, publish, ghi
      file). Đây là tool duy nhất được phép hỏi ngược người dùng; đừng đoán bừa
      giá trị còn thiếu rồi gọi thẳng tool khác.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi gửi cho người dùng"}
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: >-
            Chọn theo bản chất câu hỏi, không phải theo mặc định.
            "yes_no" khi cần người dùng xác nhận trước một hành động gửi/đăng/
            publish/ghi file. "text" khi thiếu một giá trị tự do như tên tài
            khoản hay URL. "choice" khi có sẵn danh sách lựa chọn hữu hạn.
            QUY TẮC ƯU TIÊN: nếu request là hành động gửi/đăng và đồng thời còn
            thiếu chi tiết, vẫn phải dùng "yes_no" trước - xác nhận ranh giới
            hành động luôn đi trước việc hỏi chi tiết còn thiếu.
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn, chỉ dùng khi response_type=choice"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: >-
      Tra cứu thông tin trên web. DÙNG cho tin tức, sự kiện và kiến thức chung.
      KHÔNG DÙNG cho bài đăng mạng xã hội (dùng social_search hoặc timeline) hay
      để đọc một URL cụ thể (dùng fetch). Ngữ cảnh về thời gian và loại nội dung
      phải đặt vào timeframe và topic, không nhét vào query.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: >-
            Chỉ từ khóa chủ đề cốt lõi, càng ngắn càng tốt. KHÔNG thêm từ chỉ
            thời gian ("hôm nay", "tuần này", "today") và KHÔNG thêm từ chỉ loại
            tin ("tin tức", "news") - đã có timeframe và topic lo phần đó.
            Ví dụ: "Tin AI hôm nay có gì?" thì query là "AI", không phải
            "AI news today".
        topic:
          type: string
          enum: [general, news]
          default: "general"
          description: >-
            Đặt "news" khi người dùng hỏi về tin tức, thời sự, diễn biến mới,
            hoặc "có gì mới/nổi bật". Đặt "general" cho kiến thức chung không
            gắn với dòng thời gian. Luôn set field này một cách có chủ đích,
            đừng bỏ trống khi câu hỏi rõ ràng là về tin tức.
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: "week"
          description: >-
            Quy đổi mốc tương đối trong câu hỏi: "hôm nay"/"hiện tại" -> day;
            "tuần này" -> week; "tháng này" -> month; "năm nay" -> year.
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team tools ----------------
  - name: hn_search
    description: >-
      Tìm story và thảo luận trên Hacker News, cộng đồng công nghệ/lập trình.
      DÙNG khi người dùng muốn biết cộng đồng dev đang bàn gì về một chủ đề, hoặc
      cần góc nhìn thảo luận thay vì bài báo chính thống. KHÔNG DÙNG cho tin tức
      tổng quát (dùng lookup) hay bài đăng của một tài khoản cụ thể (dùng
      timeline). Mặc định sort_by=relevance; chỉ đổi sang recent khi người dùng
      nhấn mạnh "mới nhất". timeframe mặc định "all" là không giới hạn thời gian.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm"}
        sort_by: {type: string, enum: [relevance, recent], default: "relevance", description: "relevance = liên quan nhất; recent = mới đăng nhất"}
        limit: {type: integer, default: 5, description: "Số story trả về, tối đa 10"}
        timeframe: {type: string, enum: [day, week, month, year, all], default: "all", description: "Chỉ lấy story đăng trong khoảng này; all = không giới hạn"}
      required: [query]

  - name: now
    description: >-
      Lấy ngày giờ hiện tại và quy đổi mốc thời gian tương đối thành khoảng ngày
      cụ thể. DÙNG khi cần ngày thật để điền argument cho tool khác, ví dụ người
      dùng nói "tháng trước" mà bạn phải biết đó là ngày nào. KHÔNG DÙNG khi tool
      đích đã có sẵn enum timeframe phù hợp - lúc đó gọi now chỉ tốn thêm một
      vòng mà không thêm thông tin nào.
    parameters:
      type: object
      properties:
        timezone: {type: string, default: "Asia/Ho_Chi_Minh", description: "Múi giờ IANA"}
        timeframe: {type: string, enum: [day, week, month, year], default: "", description: "Bỏ trống nếu chỉ cần biết hiện tại; điền để nhận thêm resolved_range"}
      required: []

  - name: save_digest
    description: >-
      Lưu một bản digest markdown đã hoàn chỉnh thành file trong outputs/.
      Đây là hành động ghi file, có confirmation boundary bắt buộc. LUÔN gọi lần
      đầu với confirmed=false để người dùng xem preview, rồi chỉ gọi lại với
      confirmed=true sau khi người dùng đồng ý rõ ràng. TUYỆT ĐỐI không đặt
      confirmed=true ngay lần gọi đầu tiên. Cần markdown đã render sẵn, thường là
      output của format; tool này không tự tóm tắt hay tự viết nội dung.
    parameters:
      type: object
      properties:
        markdown: {type: string, default: "", description: "Nội dung markdown hoàn chỉnh cần lưu"}
        filename: {type: string, default: "", description: "Tên file; bỏ trống để tự sinh theo timestamp"}
        confirmed: {type: boolean, default: false, description: "Chỉ đặt true sau khi người dùng đã xác nhận preview"}
      required: [markdown]

  - name: dedupe
    description: >-
      Khử trùng lặp một danh sách item đã thu thập và kiểm tra độ đa dạng nguồn.
      DÙNG khi đã có kết quả từ ít nhất hai tool tìm kiếm khác nhau và cần gộp
      lại trước khi trình bày. KHÔNG DÙNG khi chỉ có một nguồn hoặc một item,
      lúc đó không có gì để khử. Tool này không tìm kiếm gì cả, nó chỉ xử lý
      danh sách bạn truyền vào.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã thu thập"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
        match_by: {type: string, enum: [url, title], default: "url", description: "url so domain+path; title so độ tương đồng tiêu đề"}
        min_sources: {type: integer, default: 2, description: "Số nguồn khác nhau tối thiểu để coi là đủ đa dạng"}
      required: [items]
